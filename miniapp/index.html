<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ffffff" />
    <title>Мурла</title>
    
    <!-- Vercel Web Analytics + Speed Insights -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Стили -->
    <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-color: #ffffff;
  --text-color: #000000;
  --secondary-color: #757575;
  --border-color: #e0e0e0;
  --primary-color: #0088cc;
  --success-color: #31a24c;
  --error-color: #d74545;
  --input-bg: #f5f5f5;
  --radius: 12px;
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  --shadow-dark: 0 4px 16px rgba(0, 0, 0, 0.15);
}

html {
  color-scheme: var(--bg-color) var(--text-color);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  overflow-x: hidden;
  margin: 0;
  padding-bottom: 80px;
}

.container {
  max-width: 500px;
  margin: 0 auto;
  padding: 16px;
  min-height: 100vh;
}

.header {
  margin-bottom: 24px;
  position: relative;
}

.back-btn {
  background: none;
  border: none;
  color: var(--primary-color);
  font-size: 16px;
  padding: 8px 0;
  cursor: pointer;
  font-weight: 500;
  margin-bottom: 12px;
  transition: opacity 0.2s;
}

.back-btn:active {
  opacity: 0.7;
}

.header h1,
.header h2 {
  font-size: 28px;
  font-weight: 700;
  margin: 8px 0;
  color: var(--text-color);
}

.subtitle {
  color: var(--secondary-color);
  font-size: 14px;
  margin-top: 4px;
}

.menu {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 24px;
}

.menu-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  background-color: var(--input-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text-color);
  text-align: left;
  font-size: 16px;
  font-weight: 500;
}

.menu-btn:active {
  background-color: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  transform: scale(0.98);
}

.menu-icon {
  font-size: 24px;
  flex-shrink: 0;
}

.menu-text {
  flex: 1;
}

.info-block {
  background-color: var(--input-bg);
  padding: 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border-color);
}

.info-text {
  color: var(--text-color);
  font-size: 14px;
  line-height: 1.5;
}

.info-text.small {
  color: var(--secondary-color);
  font-size: 12px;
  margin-top: 4px;
}

.form {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 24px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-group label {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-color);
}

.form-group input,
.form-group select,
.form-group textarea {
  padding: 12px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  background-color: var(--input-bg);
  color: var(--text-color);
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(0, 136, 204, 0.1);
}

.form-group textarea {
  resize: vertical;
  min-height: 80px;
}

.form-group input.input-error,
.form-group textarea.input-error {
  border-color: var(--error-color);
}

.error-text {
  color: var(--error-color);
  font-size: 12px;
  margin-top: 4px;
}

.checkbox-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  padding: 8px;
  border-radius: 8px;
  transition: background-color 0.2s;
}

.checkbox-label:active {
  background-color: var(--input-bg);
}

.checkbox-label input[type='checkbox'] {
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
}

.btn {
  padding: 14px 20px;
  border: none;
  border-radius: var(--radius);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
  text-align: center;
}

.btn-primary {
  background-color: var(--primary-color);
  color: white;
}

.btn-primary:active {
  opacity: 0.85;
  transform: scale(0.98);
}

.btn-secondary {
  background-color: var(--input-bg);
  color: var(--text-color);
  border: 1px solid var(--border-color);
}

.btn-secondary:active {
  background-color: var(--border-color);
  transform: scale(0.98);
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  text-align: center;
  padding: 40px 20px;
}

.empty-icon {
  font-size: 64px;
  margin-bottom: 16px;
}

.empty-text {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--text-color);
}

.empty-subtext {
  color: var(--secondary-color);
  font-size: 14px;
  margin-bottom: 24px;
}

.profile-card {
  background-color: var(--input-bg);
  padding: 24px;
  border-radius: var(--radius);
  border: 1px solid var(--border-color);
  text-align: center;
}

.avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background-color: var(--primary-color);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 600;
  margin: 0 auto 16px;
}

.profile-card h3 {
  font-size: 20px;
  margin-bottom: 4px;
  color: var(--text-color);
}

.profile-id {
  color: var(--secondary-color);
  font-size: 12px;
  margin-bottom: 24px;
}

.profile-info {
  margin: 24px 0;
  text-align: left;
}

.info-row {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-color);
}

.info-row:last-child {
  border-bottom: none;
}

.info-label {
  color: var(--secondary-color);
  font-size: 14px;
}

.info-value {
  color: var(--text-color);
  font-weight: 600;
  font-size: 14px;
}

.notification {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background-color: var(--success-color);
  color: white;
  padding: 14px 24px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-dark);
  font-size: 14px;
  font-weight: 500;
  z-index: 1000;
  transition: transform 0.3s ease;
  max-width: calc(100% - 32px);
}

.notification.show {
  transform: translateX(-50%) translateY(0);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #1a1a1a;
    --text-color: #ffffff;
    --secondary-color: #b0b0b0;
    --border-color: #333333;
    --input-bg: #2a2a2a;
  }
}
    </style>
  </head>
  <body>
    <div id="app"></div>
    
    <script>
// Telegram Mini App SDK
const tg = window.Telegram.WebApp;

// Инициализируем приложение
tg.ready();
tg.expand();

// Цветовая схема
const isDark = tg.colorScheme === 'dark';

// Стили для разных тем
const themeColors = {
  light: {
    bg: '#ffffff',
    text: '#000000',
    secondary: '#757575',
    border: '#e0e0e0',
    primary: '#0088cc',
    success: '#31a24c',
    error: '#d74545',
    inputBg: '#f5f5f5',
  },
  dark: {
    bg: '#1a1a1a',
    text: '#ffffff',
    secondary: '#b0b0b0',
    border: '#333333',
    primary: '#0088cc',
    success: '#31a24c',
    error: '#d74545',
    inputBg: '#2a2a2a',
  },
};

const colors = isDark ? themeColors.dark : themeColors.light;

// Применяем CSS переменные
document.documentElement.style.setProperty('--bg-color', colors.bg);
document.documentElement.style.setProperty('--text-color', colors.text);
document.documentElement.style.setProperty('--secondary-color', colors.secondary);
document.documentElement.style.setProperty('--border-color', colors.border);
document.documentElement.style.setProperty('--primary-color', colors.primary);
document.documentElement.style.setProperty('--success-color', colors.success);
document.documentElement.style.setProperty('--error-color', colors.error);
document.documentElement.style.setProperty('--input-bg', colors.inputBg);

// Состояние формы
const formState = {
  step: 'main',
  orderData: {
    product: '',
    quantity: '',
    tz: '',
    needsPickup: false,
    marketplace: '',
    warehouseId: '',
    desiredDeliveryDate: '',
    comment: '',
  },
  errors: {},
};

const initData = tg.initDataUnsafe;
const userId = initData?.user?.id || 'unknown';
const userName = initData?.user?.first_name || 'Пользователь';

const app = document.getElementById('app');

// === ГЛАВНОЕ МЕНЮ ===
function renderMain() {
  app.innerHTML = `
    <div class="container">
      <div class="header">
        <h1>Мурла 📦</h1>
        <p class="subtitle">Управление заявками</p>
      </div>

      <div class="menu">
        <button class="menu-btn" onclick="goToNewOrder()">
          <span class="menu-icon">➕</span>
          <span class="menu-text">Новая заявка</span>
        </button>
        
        <button class="menu-btn" onclick="goToOrderList()">
          <span class="menu-icon">📋</span>
          <span class="menu-text">Мои заявки</span>
        </button>
        
        <button class="menu-btn" onclick="goToProfile()">
          <span class="menu-icon">👤</span>
          <span class="menu-text">Профиль</span>
        </button>
      </div>

      <div class="info-block">
        <p class="info-text">Привет, <strong>${userName}</strong>!</p>
        <p class="info-text small">Ваш ID: ${userId}</p>
      </div>
    </div>
  `;
  
  formState.step = 'main';
  updateButtonState();
}

// === НОВАЯ ЗАЯВКА ===
function renderNewOrder() {
  const { product, quantity, tz, needsPickup, marketplace, desiredDeliveryDate, comment } = formState.orderData;
  const { product: productErr, quantity: quantityErr, tz: tzErr } = formState.errors;

  app.innerHTML = `
    <div class="container">
      <div class="header">
        <button class="back-btn" onclick="goToMain()">← Назад</button>
        <h2>Новая заявка</h2>
      </div>

      <form class="form" onsubmit="submitOrder(event)">
        <div class="form-group">
          <label>Товар *</label>
          <input 
            type="text" 
            placeholder="Например: куртка красная XL"
            value="${product}"
            onchange="updateOrderData('product', this.value)"
            class="${productErr ? 'input-error' : ''}"
          />
          ${productErr ? `<span class="error-text">${productErr}</span>` : ''}
        </div>

        <div class="form-group">
          <label>Количество *</label>
          <input 
            type="text" 
            placeholder="Например: 10 шт"
            value="${quantity}"
            onchange="updateOrderData('quantity', this.value)"
            class="${quantityErr ? 'input-error' : ''}"
          />
          ${quantityErr ? `<span class="error-text">${quantityErr}</span>` : ''}
        </div>

        <div class="form-group">
          <label>ТЗ (условия) *</label>
          <textarea 
            placeholder="Техническое задание, размеры, особенности..."
            onchange="updateOrderData('tz', this.value)"
            class="${tzErr ? 'input-error' : ''}"
          >${tz}</textarea>
          ${tzErr ? `<span class="error-text">${tzErr}</span>` : ''}
        </div>

        <div class="form-group">
          <label>Нужен забор товара?</label>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input 
                type="checkbox" 
                ${needsPickup ? 'checked' : ''}
                onchange="updateOrderData('needsPickup', this.checked)"
              />
              Да, со своей точки
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Маркетплейс</label>
          <select onchange="updateOrderData('marketplace', this.value)" value="${marketplace}">
            <option value="">Не выбран</option>
            <option value="wb">Wildberries</option>
            <option value="ozon">Ozon</option>
          </select>
        </div>

        <div class="form-group">
          <label>Желаемая дата поставки</label>
          <input 
            type="text" 
            placeholder="Например: 15.04.2026"
            value="${desiredDeliveryDate}"
            onchange="updateOrderData('desiredDeliveryDate', this.value)"
          />
        </div>

        <div class="form-group">
          <label>Комментарий</label>
          <textarea 
            placeholder="Дополнительная информация..."
            onchange="updateOrderData('comment', this.value)"
          >${comment}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">
          Создать заявку
        </button>
      </form>
    </div>
  `;

  formState.step = 'new-order';
  updateButtonState();
}

// === СПИСОК ЗАЯВОК ===
function renderOrderList() {
  app.innerHTML = `
    <div class="container">
      <div class="header">
        <button class="back-btn" onclick="goToMain()">← Назад</button>
        <h2>Мои заявки</h2>
      </div>

      <div class="empty-state">
        <p class="empty-icon">📋</p>
        <p class="empty-text">Здесь будут ваши заявки</p>
        <p class="empty-subtext">Создайте новую заявку, чтобы она появилась здесь</p>
        <button class="btn btn-primary" onclick="goToNewOrder()">Создать заявку</button>
      </div>
    </div>
  `;

  formState.step = 'order-list';
  updateButtonState();
}

// === ПРОФИЛЬ ===
function renderProfile() {
  app.innerHTML = `
    <div class="container">
      <div class="header">
        <button class="back-btn" onclick="goToMain()">← Назад</button>
        <h2>Профиль</h2>
      </div>

      <div class="profile-card">
        <div class="avatar">${userName.charAt(0).toUpperCase()}</div>
        <h3>${userName}</h3>
        <p class="profile-id">ID: ${userId}</p>
        
        <div class="profile-info">
          <div class="info-row">
            <span class="info-label">Статус:</span>
            <span class="info-value">Активен</span>
          </div>
          <div class="info-row">
            <span class="info-label">Язык:</span>
            <span class="info-value">Русский</span>
          </div>
        </div>

        <button class="btn btn-secondary" onclick="logout()">
          Выход
        </button>
      </div>
    </div>
  `;

  formState.step = 'profile';
  updateButtonState();
}

// === ФУНКЦИИ НАВИГАЦИИ ===
function goToMain() {
  renderMain();
}

function goToNewOrder() {
  renderNewOrder();
}

function goToOrderList() {
  renderOrderList();
}

function goToProfile() {
  renderProfile();
}

// === ФУНКЦИИ РАБОТЫ С ФОРМОЙ ===
function updateOrderData(field, value) {
  formState.orderData[field] = value;
  if (formState.errors[field]) {
    delete formState.errors[field];
  }
}

function validateOrder() {
  const errors = {};
  const { product, quantity, tz } = formState.orderData;

  if (!product || product.trim().length === 0) {
    errors.product = 'Укажите товар';
  }
  if (!quantity || quantity.trim().length === 0) {
    errors.quantity = 'Укажите количество';
  }
  if (!tz || tz.trim().length === 0) {
    errors.tz = 'Укажите ТЗ/условия';
  }

  formState.errors = errors;
  return Object.keys(errors).length === 0;
}

function submitOrder(event) {
  event.preventDefault();
  
  if (!validateOrder()) {
    renderNewOrder();
    return;
  }

  const orderData = {
    ...formState.orderData,
    userId,
    userName,
    timestamp: new Date().toISOString(),
  };

  tg.sendData(JSON.stringify(orderData));

  showNotification('✅ Заявка создана!');

  formState.orderData = {
    product: '',
    quantity: '',
    tz: '',
    needsPickup: false,
    marketplace: '',
    warehouseId: '',
    desiredDeliveryDate: '',
    comment: '',
  };

  setTimeout(() => goToMain(), 1500);
}

function logout() {
  tg.close();
}

// === УВЕДОМЛЕНИЯ ===
function showNotification(text) {
  const notification = document.createElement('div');
  notification.className = 'notification';
  notification.textContent = text;
  document.body.appendChild(notification);

  setTimeout(() => {
    notification.classList.add('show');
  }, 10);

  setTimeout(() => {
    notification.classList.remove('show');
    setTimeout(() => notification.remove(), 300);
  }, 2500);
}

function updateButtonState() {
  if (formState.step === 'new-order') {
    tg.MainButton.text = 'Создать заявку';
    tg.MainButton.show();
    tg.MainButton.onClick(() => submitOrder({preventDefault: ()=>{}}));
  } else {
    tg.MainButton.hide();
  }
}

renderMain();
    </script>
  </body>
</html>
