<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Murla client bot</title>
    <!-- Vercel: включите Web Analytics и Speed Insights в дашборде проекта, иначе скрипты не отдадут данные. -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
      window.si =
        window.si ||
        function () {
          (window.siq = window.siq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <p>Бэкенд Telegram-бота Мурлы. Webhook: <code>/api/telegram</code></p>
    <p><a href="/miniapp/">Открыть Mini App</a></p>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Если в BotFather указан корень сайта без /miniapp/ — всё равно открываем приложение
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.location.replace(
          window.location.origin + "/miniapp/" + (window.location.search || ""),
        );
      }
    </script>
  </body>
</html>
